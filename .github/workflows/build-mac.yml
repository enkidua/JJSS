name: Build macOS (Apple Silicon)

# 수동 실행 또는 빌드 전용 브랜치 푸시 시 실행. 결과는 Actions Artifacts로만 올립니다.
on:
  workflow_dispatch:
  push:
    branches:
      - codex/mac-installer-build

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/website/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run test:all
      # Test distribution: ad-hoc integrity signature, not Developer ID/notarization.
      - run: npm run electron:build:mac -- --config.afterPack=./scripts/sign-mac-adhoc.cjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify disk image, nested signatures and arm64 startup
        run: |
          node scripts/verify-mac-dmg.cjs release/JJSS-*-arm64.dmg
          shasum -a 256 release/*.dmg release/*-mac.zip > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jjss-mac-arm64
          path: |
            release/*.dmg
            release/*-mac.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
